name: Build Mr Moj APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyChat_Android_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip MyChat_Android_Starter.zip -d source

      - name: Fix JVM targets
        run: |
          cat >> source/MyChat_Android_Starter/app/build.gradle.kts <<'EOF'

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Build APK
        run: |
          cd source/MyChat_Android_Starter
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Moj-APK
          path: source/MyChat_Android_Starter/app/build/outputs/apk/debug/*.apk
